name: PRPilot Verification

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "PR commit SHA to verify"
        required: true
        type: string
      mode:
        description: "Verification mode requested by PRPilot"
        required: true
        type: choice
        options:
          - TESTS
          - SAST
      finding_json:
        description: "JSON findings generated by PRPilot"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify PRPilot findings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show verification request
        env:
          FINDINGS: ${{ inputs.finding_json }}
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get("FINDINGS", "")
          if not raw:
              print("No finding payload supplied.")
              raise SystemExit(0)
          try:
              findings = json.loads(raw)
              print("PRPilot requested verification for:")
              for f in findings:
                  print(f"- [{f.get('severity')}] {f.get('file')}:{f.get('line')} — {f.get('title')}")
          except Exception:
              print("Finding payload could not be parsed; continuing with repository checks.")

      # IMPORTANT:
      # Replace the commands below with the commands your repository already uses.
      # Do NOT allow the AI to supply shell commands.
      - name: Run repository tests
        if: ${{ inputs.mode == 'TESTS' }}
        run: |
          echo "Configure this step for your project's test command."
          if [ -f package.json ]; then
            npm ci
            npm test -- --runInBand
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            python -m pip install -r requirements.txt 2>/dev/null || true
            python -m pytest -q
          elif [ -f pom.xml ]; then
            ./mvnw test 2>/dev/null || mvn test
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test
          else
            echo "No supported test project detected."
            exit 1
          fi

      - name: Install Semgrep
        if: ${{ inputs.mode == 'SAST' }}
        run: |
          python -m pip install semgrep

      - name: Run Semgrep
        if: ${{ inputs.mode == 'SAST' }}
        run: |
          semgrep scan --config=p/ci --error --json --output=semgrep-results.json || true

      - name: Publish SAST results
        if: ${{ inputs.mode == 'SAST' }}
        run: |
          if [ -f semgrep-results.json ]; then
            python - <<'PY'
          import json
          with open("semgrep-results.json", encoding="utf-8") as f:
              data=json.load(f)
          results=data.get("results", [])
          errors=data.get("errors", [])
          print(f"Semgrep findings: {len(results)}")
          print(f"Semgrep errors: {len(errors)}")
          for r in results[:20]:
              print(f"- {r.get('check_id')}: {r.get('path')}:{r.get('start',{}).get('line')}")
          PY
          fi

      - name: Verification summary
        if: always()
        run: |
          echo "PRPilot verification completed."
          echo "Mode: ${{ inputs.mode }}"
          echo "Commit: ${{ inputs.head_sha }}"
