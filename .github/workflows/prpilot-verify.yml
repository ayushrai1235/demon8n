name: PRPilot Verification

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "PR commit SHA to verify"
        required: true
        type: string

      mode:
        description: "Verification mode requested by PRPilot"
        required: true
        type: choice
        options:
          - TESTS
          - SAST

      finding_json:
        description: "JSON findings generated by PRPilot"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify PRPilot Findings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the exact commit analyzed by PRPilot
      # ---------------------------------------------------------
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Display the findings received from PRPilot
      # ---------------------------------------------------------
      - name: Show verification request
        env:
          FINDINGS: ${{ inputs.finding_json }}
        run: |
          python - <<'PY'
          import json
          import os

          raw = os.environ.get("FINDINGS", "")

          if not raw:
              print("No finding payload supplied.")
              raise SystemExit(0)

          try:
              findings = json.loads(raw)

              if isinstance(findings, dict):
                  findings = findings.get("findings", [])

              print("PRPilot requested verification for:")

              for finding in findings:
                  severity = finding.get("severity", "UNKNOWN")
                  file_name = finding.get("file", "unknown")
                  line = finding.get("line", "?")
                  title = finding.get("title", "Untitled finding")

                  print(
                      f"- [{severity}] "
                      f"{file_name}:{line} — {title}"
                  )

          except Exception as error:
              print(
                  "Finding payload could not be parsed; "
                  "continuing with repository checks."
              )
              print(f"Parse error: {error}")
          PY

      # ---------------------------------------------------------
      # 4. Run repository tests
      # ---------------------------------------------------------
      - name: Run repository tests
        if: ${{ inputs.mode == 'TESTS' }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PRPilot TEST verification"
          echo "======================================"

          if [ -f package.json ]; then
            echo "Node.js project detected."

            if [ -f package-lock.json ]; then
              npm ci
            elif [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi

            npm test -- --runInBand

          elif [ -f pyproject.toml ]; then
            echo "Python project detected."

            python -m pip install --upgrade pip
            python -m pip install pytest

            if grep -q "\[project\]" pyproject.toml; then
              python -m pip install .
            fi

            python -m pytest -q

          elif [ -f requirements.txt ]; then
            echo "Python project detected."

            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest

            python -m pytest -q

          elif [ -f pom.xml ]; then
            echo "Maven project detected."

            if [ -f mvnw ]; then
              chmod +x mvnw
              ./mvnw test
            else
              mvn test
            fi

          elif [ -f gradlew ]; then
            echo "Gradle project detected."

            chmod +x gradlew
            ./gradlew test

          else
            echo "No supported test project detected."
            exit 1
          fi

      # ---------------------------------------------------------
      # 5. Install Semgrep
      # ---------------------------------------------------------
      - name: Install Semgrep
        if: ${{ inputs.mode == 'SAST' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      # ---------------------------------------------------------
      # 6. Run Semgrep security analysis
      # ---------------------------------------------------------
      - name: Run Semgrep
        if: ${{ inputs.mode == 'SAST' }}
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "PRPilot SAST verification"
          echo "======================================"

          semgrep scan \
            --config=p/ci \
            --json \
            --output=semgrep-results.json

          SEMGREP_EXIT_CODE=$?

          echo "Semgrep exit code: $SEMGREP_EXIT_CODE"

          # We don't fail here because the purpose of this step
          # is to collect verification evidence.
          exit 0

      # ---------------------------------------------------------
      # 7. Publish SAST results
      # ---------------------------------------------------------
      - name: Publish SAST results
        if: ${{ inputs.mode == 'SAST' }}
        shell: bash
        run: |
          if [ ! -f semgrep-results.json ]; then
            echo "No Semgrep result file was generated."
            exit 0
          fi

          python - <<'PY'
          import json

          with open("semgrep-results.json", encoding="utf-8") as file:
              data = json.load(file)

          results = data.get("results", [])
          errors = data.get("errors", [])

          print("======================================")
          print("Semgrep Verification Results")
          print("======================================")

          print(f"Semgrep findings: {len(results)}")
          print(f"Semgrep errors: {len(errors)}")

          for result in results[:20]:
              check_id = result.get("check_id", "unknown")
              path = result.get("path", "unknown")
              line = result.get("start", {}).get("line", "?")

              print(
                  f"- {check_id}: "
                  f"{path}:{line}"
              )

          if errors:
              print("")
              print("Semgrep reported errors:")
              for error in errors[:10]:
                  print(f"- {error}")
          PY

      # ---------------------------------------------------------
      # 8. Verification summary
      # ---------------------------------------------------------
      - name: Verification summary
        if: always()
        run: |
          echo "======================================"
          echo "PRPilot Verification Completed"
          echo "======================================"

          echo "Mode: ${{ inputs.mode }}"
          echo "Commit: ${{ inputs.head_sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"